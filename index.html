<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAHARA - Worldwide Rescue Network</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--lav:#E9D5FF;--deep:#8B5CF6;--green:#22C55E;--orange:#F59E0B;--red:#EF4444}
*{font-family:'Poppins',sans-serif;box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#FFFBFF 0%,#E9D5FF 100%);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
header{background:#fff;padding:22px;border-radius:26px;text-align:center;box-shadow:0 10px 30px rgba(139,92,246,.18)}
.logo{font-size:30px;font-weight:700;color:var(--deep)}
.badge{background:var(--lav);padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700}
.card{background:#fff;border-radius:26px;padding:20px;margin-top:16px;box-shadow:0 10px 30px rgba(139,92,246,.14)}
input,textarea{width:100%;padding:15px;border:2px solid var(--lav);border-radius:16px;outline:none;font-size:16px}
.row{display:flex;gap:8px}.mic{border:none;background:var(--lav);border-radius:14px;padding:0 18px;font-size:20px;cursor:pointer;min-width:56px;transition:0.3s}
.mic.listening{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.s-btn{flex:1;padding:14px;border-radius:16px;border:2px solid var(--lav);background:#fff;font-weight:700;cursor:pointer;font-size:13px}
.s-btn.active{color:#fff;transform:scale(1.05)}.s-btn[data-s="SAFE"].active{background:var(--green);border-color:var(--green)}.s-btn[data-s="INJURED"].active{background:var(--orange);border-color:var(--orange)}.s-btn[data-s="CRITICAL"].active{background:var(--red);border-color:var(--red)}
.send{width:100%;margin-top:12px;padding:18px;border:none;border-radius:18px;background:var(--deep);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.sos{flex:1;background:var(--red);color:#fff;border:none;border-radius:14px;font-weight:700;cursor:pointer}
.locBtn{flex:1;background:#0EA5E9;color:#fff;border:none;border-radius:14px;font-weight:700;cursor:pointer}
#feed{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.msg{padding:14px;border-radius:18px;background:#FAF5FF;border-left:7px solid #C4A7E7;position:relative}
.msg.SAFE{border-left-color:var(--green)}.msg.INJURED{border-left-color:var(--orange)}.msg.CRITICAL{border-left-color:var(--red);background:#FFF1F2}
.del{position:absolute;top:8px;right:8px;border:none;background:#FFE4E6;padding:4px 8px;border-radius:8px;cursor:pointer;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.locTag{margin-top:8px;background:#E0F2FE;padding:10px 12px;border-radius:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;border:1px solid #7DD3FC}
.locTag a{color:#0284C7;font-weight:700;text-decoration:none;background:#fff;padding:5px 10px;border-radius:8px}
.pmsg{padding:8px 12px;border-radius:12px;font-size:13px;max-width:85%}
.pmsg.mine{background:var(--deep);color:#fff;align-self:flex-end}
.pmsg.other{background:#fff;align-self:flex-start;border:1px solid var(--lav)}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">🛟 SAHARA</div>
<p style="font-size:13px;color:#666;margin:4px 0">Worldwide Rescue Network</p>
<div class="badge">🌍 <span id="count">Connecting worldwide...</span></div>
<div style="margin-top:8px"><button onclick="devLogin()" style="font-size:10px;border:none;background:#111;color:#fff;padding:4px 10px;border-radius:20px;cursor:pointer">🔑 Dev Login</button> <span id="devStatus" style="font-size:10px;color:#666">User Mode</span></div>
</header>

<div class="card">
<label style="font-size:11px;font-weight:700;color:#666">YOUR NAME</label>
<div class="row" style="margin-bottom:10px"><input id="name" placeholder="Ex: Aarav"><button class="mic" onclick="voice('name',this)">🎤</button></div>
<label style="font-size:11px;font-weight:700;color:#666">AGE</label><input id="age" type="number" placeholder="21" style="margin-bottom:12px">
<div class="row"><button class="s-btn" data-s="SAFE" onclick="pick(this)">😊 SAFE</button><button class="s-btn" data-s="INJURED" onclick="pick(this)">🤕 INJURED</button><button class="s-btn" data-s="CRITICAL" onclick="pick(this)">🆘 CRITICAL</button></div>
</div>

<div class="card">
<textarea id="sit" placeholder="Describe your situation..."></textarea>
<div id="locStatus" style="display:none;margin-top:8px;background:#DCFCE7;padding:10px;border-radius:12px;font-size:12px;color:#166534;font-weight:600"></div>
<div class="row" style="margin-top:10px"><button class="mic" style="flex:1;padding:12px" onclick="voice('sit',this)">🎤 Speak</button><button class="locBtn" onclick="getLoc()">📍 Live Location</button><button class="sos" onclick="sendSOS()">🚨 SOS</button></div>
<button class="send" onclick="send()">📡 BROADCAST TO WORLD</button>
</div>

<div class="card" id="privateBox" style="display:none;border:2px solid var(--deep)">
<h3 style="margin:0 0 10px;color:var(--deep)">💬 Private with <span id="pTarget"></span> <button onclick="closeP()" style="float:right;border:none;background:var(--lav);padding:4px 10px;border-radius:8px;cursor:pointer">X</button></h3>
<div id="pFeed" style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;background:#FAF5FF;padding:10px;border-radius:12px"></div>
<div class="row"><input id="pInput" placeholder="Type private message..."><button class="send" style="width:auto;margin:0;padding:12px 20px" onclick="sendPrivate()">Send</button></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0;color:#4C1D95;font-size:16px">🌍 Live From World</h3><button id="clearBtn" style="display:none;border:none;background:var(--red);color:#fff;padding:6px 12px;border-radius:10px;font-weight:600;cursor:pointer" onclick="clearAll()">Clear All (Dev)</button></div>
<div id="feed"></div>
</div>

<div class="card">
<h3 style="margin:0 0 10px;color:#4C1D95;font-size:16px">🔒 My Private Chats</h3>
<div id="myPrivateList" style="font-size:13px;color:#666">Enter your name to see chats</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHk9kRv24-gIQUMRKtihHGoravvXN1r9E",
  authDomain: "real-sahara.firebaseapp.com",
  databaseURL: "https://real-sahara-default-rtdb.firebaseio.com",
  projectId: "real-sahara",
  storageBucket: "real-sahara.firebasestorage.app",
  messagingSenderId: "104403006710",
  appId: "1:104403006710:web:d0781f49545a902f4128d7",
  measurementId: "G-88D7PLELXT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let status=null, currentLoc=null, privateTarget=null, isDev=false;
const DEV_PASS = "SaharaDevRescue";

function devLogin(){
  const p = prompt("Enter Developer Password:");
  if(p===DEV_PASS){isDev=true; document.getElementById('devStatus').innerText="✅ Developer Mode"; document.getElementById('devStatus').style.color="#22C55E"; document.getElementById('clearBtn').style.display="block"; alert("Dev mode ON - You can delete now"); loadFeed();
  } else if(p!==null){alert("Wrong password");}
}

function pick(el){document.querySelectorAll('.s-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');status=el.dataset.s;}
function voice(id, btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Use Chrome');return;}
  const r=new SR(); r.lang='en-IN'; btn.classList.add('listening'); let orig=btn.innerHTML; btn.innerHTML='🔴 Listening...'; r.start();
  r.onresult=e=>{document.getElementById(id).value=e.results[0][0].transcript;};
  r.onend=()=>{btn.classList.remove('listening'); btn.innerHTML=orig;};
  r.onerror=()=>{btn.classList.remove('listening'); btn.innerHTML=orig;};
}
function getLoc(){
  const btn=document.querySelector('.locBtn'); btn.innerText='⏳ Getting Live...';
  navigator.geolocation.getCurrentPosition(pos=>{
    currentLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};
    document.getElementById('locStatus').style.display='block';
    document.getElementById('locStatus').innerHTML=`📍 Live attached: ${currentLoc.lat.toFixed(5)}, ${currentLoc.lng.toFixed(5)} - Everyone will see`;
    btn.innerText='✅ Live Added'; btn.style.background='#22C55E';
  },err=>{alert('Allow location! '+err.message); btn.innerText='📍 Live Location';},{enableHighAccuracy:true});
}
function send(isSOS=false){
  const n=document.getElementById('name').value.trim(), a=document.getElementById('age').value.trim(), s=document.getElementById('sit').value.trim();
  if(!n||!a||!status||!s){alert('Fill all fields');return;}
  db.collection('sahara_global').add({name:n,age:a,status:status,text:s,time:new Date().toLocaleString(),at:Date.now(),sos:isSOS,loc:currentLoc});
  document.getElementById('sit').value=''; currentLoc=null;
  document.getElementById('locStatus').style.display='none';
  const b=document.querySelector('.locBtn'); b.innerText='📍 Live Location'; b.style.background='#0EA5E9';
}
function sendSOS(){if(!status){status='CRITICAL';document.querySelector('[data-s="CRITICAL"]').classList.add('active');}document.getElementById('sit').value='🚨 SOS EMERGENCY! '+document.getElementById('sit').value;send(true);}

function loadFeed(){
  db.collection('sahara_global').orderBy('at','desc').onSnapshot(snap=>{
    let msgs=[]; snap.forEach(doc=>{msgs.push({id:doc.id,...doc.data()});});
    document.getElementById('count').innerText=msgs.length+' Messages Worldwide - Visible to all';
    const f=document.getElementById('feed');
    if(!msgs.length){f.innerHTML='<p style="text-align:center;color:#999;padding:20px">No messages yet.</p>';return;}
    f.innerHTML=msgs.map(m=>{
      let locHtml=''; if(m.loc&&m.loc.lat){const mapLink=`https://www.google.com/maps?q=${m.loc.lat},${m.loc.lng}`; locHtml=`<div class="locTag"><span>📍 ${m.loc.lat.toFixed(4)}, ${m.loc.lng.toFixed(4)}</span><a href="${mapLink}" target="_blank">View Map 🗺️</a></div>`;}
      const delBtn = isDev? `<button class="del" style="display:block" onclick="delMsg('${m.id}')">🗑️ Delete</button>` : '';
      return `<div class="msg ${m.status}">${delBtn}<b>${m.sos?'🚨 ':''}${m.name} (${m.age}) • ${m.status}</b><br><small>${m.time}</small><p style="margin:8px 0 0">${m.text}</p>${locHtml}<div class="row" style="margin-top:8px"><button style="flex:1;border:none;background:#fff;padding:6px;border-radius:8px;cursor:pointer" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${m.text.replace(/'/g,'')}'))">🔊 Read</button><button style="flex:1;border:none;background:var(--deep);color:#fff;padding:6px;border-radius:8px;cursor:pointer;font-weight:600" onclick="openPrivate('${m.name}')">💬 Private Chat</button></div></div>`;
    }).join('');
  });
}
loadFeed();

function openPrivate(name){
  const myName=document.getElementById('name').value.trim();
  if(!myName){alert('Enter YOUR NAME first'); return;}
  if(name===myName){alert('Cannot chat yourself'); return;}
  privateTarget=name; document.getElementById('pTarget').innerText=name;
  document.getElementById('privateBox').style.display='block';
  document.getElementById('privateBox').scrollIntoView({behavior:'smooth'});
  db.collection('private_chats').orderBy('at','asc').onSnapshot(snap=>{
    const pFeed=document.getElementById('pFeed'); let html=''; let c=0;
    snap.forEach(doc=>{
      const d=doc.data();
      if((d.from===myName && d.to===privateTarget) || (d.from===privateTarget && d.to===myName)){
        c++; const cls=d.from===myName?'mine':'other';
        html+=`<div class="pmsg ${cls}"><b>${d.from}:</b> ${d.text}<br><small style="font-size:10px;opacity:0.7">${d.time}</small></div>`;
      }
    });
    pFeed.innerHTML=c?html:'<p style="text-align:center;color:#999;font-size:12px">No private messages yet</p>';
    pFeed.scrollTop=pFeed.scrollHeight;
  });
}
function closeP(){document.getElementById('privateBox').style.display='none'; privateTarget=null;}
function sendPrivate(){
  const myName=document.getElementById('name').value.trim();
  const txt=document.getElementById('pInput').value.trim();
  if(!txt) return;
  db.collection('private_chats').add({from:myName,to:privateTarget,text:txt,at:Date.now(),time:new Date().toLocaleString()});
  document.getElementById('pInput').value='';
}
db.collection('private_chats').orderBy('at','desc').onSnapshot(snap=>{
  const myName=document.getElementById('name').value.trim();
  const list=document.getElementById('myPrivateList');
  if(!myName){list.innerText='Enter your name to see private chats'; return;}
  const chats={};
  snap.forEach(doc=>{
    const d=doc.data();
    if(d.from===myName || d.to===myName){
      const other=d.from===myName?d.to:d.from;
      if(!chats[other]) chats[other]=d;
    }
  });
  const others=Object.keys(chats);
  if(!others.length){list.innerHTML='<p style="color:#999">No private chats yet.</p>';return;}
  list.innerHTML=others.map(o=>`<div style="padding:8px;background:#FAF5FF;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><span>💬 ${o}<br><small style="color:#888">${chats[o].text.slice(0,30)}...</small></span><button onclick="openPrivate('${o}')" style="border:none;background:var(--deep);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer">Open</button></div>`).join('');
});
function delMsg(id){if(!isDev){alert("Only developer can delete. Click Dev Login"); return;} if(confirm('Delete for everyone?')){db.collection('sahara_global').doc(id).delete();}}
function clearAll(){if(!isDev){alert("Only developer"); return;} if(confirm('Delete ALL worldwide?')){db.collection('sahara_global').get().then(s=>{s.forEach(d=>d.ref.delete());});}}
</script>
</body>
</html>
